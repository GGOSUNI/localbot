<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LocalBot</title>
<style>
  :root {
    --bg: #0f1115; --panel: #171a21; --line: #262a33; --text: #e7e9ee; --muted: #8b91a0;
    --accent: #00d564; --warn: #ffb020; --err: #ff5470; --donation: #ffd84d;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font: 14px/1.5 system-ui, "Malgun Gothic", sans-serif; background: var(--bg); color: var(--text); }
  header { display: flex; align-items: center; gap: 12px; padding: 12px 20px; border-bottom: 1px solid var(--line); }
  header h1 { font-size: 16px; margin: 0; }
  .badge { padding: 2px 10px; border-radius: 999px; font-size: 12px; background: var(--line); color: var(--muted); }
  .badge.ok { background: color-mix(in srgb, var(--accent) 20%, transparent); color: var(--accent); }
  .badge.bad { background: color-mix(in srgb, var(--err) 20%, transparent); color: var(--err); }
  main { display: grid; grid-template-columns: 320px 1fr; gap: 16px; padding: 16px 20px; }
  @media (max-width: 760px) { main { grid-template-columns: 1fr; } }
  section { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 14px; }
  h2 { font-size: 13px; color: var(--muted); margin: 0 0 10px; font-weight: 600; }
  form { display: grid; gap: 8px; margin-bottom: 16px; }
  input, button { font: inherit; border-radius: 6px; border: 1px solid var(--line); background: var(--bg); color: var(--text); padding: 7px 10px; }
  button { cursor: pointer; background: var(--line); }
  button.primary { background: var(--accent); color: #04140a; border-color: transparent; font-weight: 600; }
  button.danger { color: var(--err); }
  #feed { list-style: none; margin: 0; padding: 0; max-height: calc(100vh - 140px); overflow-y: auto; }
  #feed li { display: flex; gap: 10px; padding: 6px 4px; border-bottom: 1px solid var(--line); }
  #feed time { color: var(--muted); font-variant-numeric: tabular-nums; flex: none; }
  .t-donation { color: var(--donation); }
  .t-system { color: var(--muted); }
  .t-system.warn { color: var(--warn); } .t-system.error { color: var(--err); }
  .who { font-weight: 600; margin-right: 6px; }
  .src { margin-left: auto; color: var(--muted); font-size: 12px; flex: none; }
</style>
</head>
<body>
<header>
  <h1>LocalBot</h1>
  <span id="conn" class="badge">연결 중…</span>
  <span id="worker" class="badge"></span>
</header>
<main>
  <section>
    <h2>테스트 (Mock 어댑터)</h2>
    <form id="f-donation">
      <input name="nickname" placeholder="닉네임 (비우면 익명)" value="치즈러버">
      <input name="amount" type="number" min="1" step="1" value="5000" required>
      <input name="text" placeholder="후원 메시지" value="룰렛 돌려주세요!">
      <button class="primary">가짜 후원 보내기</button>
    </form>
    <form id="f-chat">
      <input name="nickname" value="시청자1">
      <input name="text" value="!업타임">
      <button>가짜 채팅 보내기</button>
    </form>
    <h2>자가 복구 확인</h2>
    <button id="crash" class="danger">워커 강제 종료</button>
  </section>
  <section>
    <h2>실시간 이벤트</h2>
    <ul id="feed"></ul>
  </section>
</main>
<script>
  const feed = document.getElementById('feed');
  const conn = document.getElementById('conn');
  const workerBadge = document.getElementById('worker');

  function el(tag, cls, text) {
    const e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text !== undefined) e.textContent = text; // 채팅은 항상 textContent (XSS 방지)
    return e;
  }

  function render(env) {
    const ev = env.event;
    const li = el('li');
    li.append(el('time', '', new Date(env.ts).toLocaleTimeString('ko-KR', { hour12: false })));
    const body = el('span');
    if (ev.type === 'chat') {
      body.append(el('span', 'who', ev.viewer.nickname), document.createTextNode(ev.text));
    } else if (ev.type === 'donation') {
      body.className = 't-donation';
      body.append(el('span', 'who', `💰 ${ev.viewer ? ev.viewer.nickname : '익명'}`),
        document.createTextNode(`${ev.amountKRW.toLocaleString('ko-KR')}원${ev.text ? ' — ' + ev.text : ''}`));
    } else if (ev.type === 'system') {
      body.className = `t-system ${ev.level}`;
      body.textContent = `⚙ ${ev.message}`;
    } else {
      body.textContent = `${ev.type} ${JSON.stringify(ev)}`;
    }
    li.append(body, el('span', 'src', env.source));
    feed.prepend(li);
    while (feed.children.length > 300) feed.lastChild.remove();
  }

  let retry = 0;
  function connect() {
    const ws = new WebSocket(`ws://${location.host}/ws`);
    ws.onopen = () => { retry = 0; conn.textContent = '연결됨'; conn.className = 'badge ok'; };
    ws.onmessage = (m) => {
      const msg = JSON.parse(m.data);
      if (msg.type === 'hello') {
        feed.replaceChildren();
        msg.recent.forEach(render);
        workerBadge.textContent = `워커 시작 ${new Date(msg.workerStartedAt).toLocaleTimeString('ko-KR', { hour12: false })}`;
      } else if (msg.type === 'event') render(msg.envelope);
    };
    ws.onclose = () => {
      conn.textContent = '재연결 중…'; conn.className = 'badge bad';
      setTimeout(connect, Math.min(5000, 300 * 2 ** retry++));
    };
  }
  connect();

  async function post(path, body) {
    const r = await fetch(path, { method: 'POST', headers: { 'content-type': 'application/json', 'x-localbot': '1' }, body: JSON.stringify(body ?? {}) });
    if (!r.ok) alert(`실패: ${r.status}`);
  }
  for (const [id, path] of [['f-donation', '/api/mock/donation'], ['f-chat', '/api/mock/chat']]) {
    document.getElementById(id).addEventListener('submit', (e) => {
      e.preventDefault();
      post(path, Object.fromEntries(new FormData(e.target)));
    });
  }
  document.getElementById('crash').onclick = () => post('/api/debug/crash');
</script>
</body>
</html>
