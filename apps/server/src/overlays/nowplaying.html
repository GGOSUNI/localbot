<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>LocalBot 현재 곡</title>
<style>
  html, body { margin: 0; background: transparent; overflow: hidden; font-family: "Pretendard", "Malgun Gothic", system-ui, sans-serif; }
  #card {
    position: absolute; left: 16px; bottom: 16px; width: min(560px, calc(100vw - 32px));
    display: flex; gap: 14px; align-items: center; padding: 12px 16px 14px; border-radius: 14px;
    background: rgba(15, 17, 21, .82); color: #fff; box-shadow: 0 6px 24px rgba(0,0,0,.35);
    transform: translateY(140%); transition: transform .5s cubic-bezier(.2,.8,.2,1);
  }
  #card.show { transform: none; }
  #thumb { width: 64px; height: 64px; border-radius: 10px; background: #262a33 center/cover; flex: none; display: grid; place-items: center; font-size: 28px; }
  #info { min-width: 0; flex: 1; }
  #label { font-size: 12px; color: #00d564; font-weight: 700; letter-spacing: .02em; }
  #title { font-size: 18px; font-weight: 800; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #who { font-size: 13px; color: #b7bcc8; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #bar { height: 4px; background: rgba(255,255,255,.15); border-radius: 2px; margin-top: 8px; overflow: hidden; }
  #bar i { display: block; height: 100%; width: 0; background: #00d564; transition: width 1s linear; }
  #next { font-size: 12px; color: #8b91a0; margin-top: 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
</style>
</head>
<body>
<div id="card">
  <div id="thumb"></div>
  <div id="info">
    <div id="label">NOW PLAYING</div>
    <div id="title"></div>
    <div id="who"></div>
    <div id="bar"><i></i></div>
    <div id="next"></div>
  </div>
</div>
<script type="module" src="./nowplaying.ts"></script>
</body>
</html>
