<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>LocalBot 룰렛</title>
<style>
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; font-family: "Pretendard", "Malgun Gothic", system-ui, sans-serif; color: #fff; }
  #stage { position: absolute; inset: 0; display: grid; place-items: center; opacity: 0; transition: opacity .4s; }
  #stage.show { opacity: 1; }
  #box { display: flex; flex-direction: column; align-items: center; gap: 14px; }
  #head { font-size: 26px; font-weight: 900; text-shadow: 0 2px 8px rgba(0,0,0,.7); text-align: center; }
  #head small { display: block; font-size: 16px; font-weight: 700; opacity: .85; }
  #wrap { position: relative; width: min(70vh, 80vw); aspect-ratio: 1; }
  canvas { width: 100%; height: 100%; filter: drop-shadow(0 8px 24px rgba(0,0,0,.5)); }
  #pin { position: absolute; left: 50%; top: -6px; transform: translateX(-50%); width: 0; height: 0;
         border-left: 18px solid transparent; border-right: 18px solid transparent; border-top: 36px solid #fff;
         filter: drop-shadow(0 2px 4px rgba(0,0,0,.6)); }
  #result { min-height: 56px; font-size: 40px; font-weight: 900; text-align: center; text-shadow: 0 3px 12px rgba(0,0,0,.8);
            transform: scale(.6); opacity: 0; transition: transform .35s cubic-bezier(.2,1.6,.4,1), opacity .2s; }
  #result.show { transform: none; opacity: 1; }
  #cards { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; max-width: 80vw; }
  .card { background: rgba(15,17,21,.85); border: 2px solid #00d564; border-radius: 10px; padding: 6px 12px; font-size: 18px; font-weight: 800;
          opacity: 0; transform: translateY(10px); transition: all .3s; }
  .card.show { opacity: 1; transform: none; }
</style>
</head>
<body>
<div id="stage">
  <div id="box">
    <div id="head"></div>
    <div id="wrap"><canvas id="wheel" width="800" height="800"></canvas><div id="pin"></div></div>
    <div id="result"></div>
    <div id="cards"></div>
  </div>
</div>
<script type="module" src="./roulette.ts"></script>
</body>
</html>
