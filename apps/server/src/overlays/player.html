<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>LocalBot 플레이어</title>
<style>
  html, body { margin: 0; background: transparent; color: #e7e9ee; font: 14px/1.5 system-ui, "Malgun Gothic", sans-serif; }
  .media { position: fixed; left: -10000px; top: 0; width: 320px; height: 180px; }
  #panel { display: none; max-width: 520px; margin: 40px auto; background: #171a21; border: 1px solid #262a33; border-radius: 12px; padding: 20px; }
  body.browser { background: #0f1115; }
  body.browser #panel { display: block; }
  #panel h1 { font-size: 16px; margin: 0 0 4px; }
  #panel .muted { color: #8b91a0; font-size: 12px; }
  #title { font-size: 18px; font-weight: 700; margin: 16px 0 4px; word-break: break-all; }
  #bar { height: 6px; background: #262a33; border-radius: 3px; overflow: hidden; margin-top: 10px; }
  #bar i { display: block; height: 100%; width: 0; background: #00d564; }
  #unlock { display: none; width: 100%; margin-top: 16px; padding: 14px; border: 0; border-radius: 10px; background: #00d564; color: #04140a; font: 700 16px system-ui; cursor: pointer; }
  #unlock.show { display: block; }
  .badge { display: inline-block; padding: 1px 8px; border-radius: 999px; font-size: 12px; background: #262a33; color: #8b91a0; }
  .badge.ok { background: #0a3d24; color: #00d564; }
</style>
</head>
<body>
<div class="media"><div id="yt-main"></div></div>
<div class="media"><div id="yt-pre"></div></div>
<audio id="audio" preload="auto"></audio>
<div id="panel">
  <h1>🎵 LocalBot 플레이어 <span id="role" class="badge">연결 중…</span></h1>
  <div class="muted">이 탭(또는 OBS 브라우저 소스)에서 신청곡 소리가 납니다. 닫으면 재생이 멈춥니다.</div>
  <div id="title">—</div>
  <div class="muted" id="sub"></div>
  <div id="bar"><i></i></div>
  <button id="unlock">▶ 클릭해서 소리 켜기</button>
</div>
<script type="module" src="./player.ts"></script>
</body>
</html>
